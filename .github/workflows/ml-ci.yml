name: ML CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ML tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository without executing ML code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce fresh-UCSD-pod execution policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          else
            changed_files="$(git show --pretty='' --name-only "$HEAD_SHA")"
          fi

          if grep -qE '^ml/' <<<"$changed_files"; then
            echo "::error::ML files changed. Project policy requires verification on a fresh UCSD cloud pod; GitHub-hosted and local ML execution are disabled."
            exit 1
          fi

          echo "No ML files changed. No model code was imported, constructed, or invoked."
