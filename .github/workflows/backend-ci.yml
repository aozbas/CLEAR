name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-phone.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-api.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check backend scripts

      - name: Ruff format check
        run: python -m ruff format --check backend scripts

      - name: Test without importing ML runtimes
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.TestSuite(
              [
                  unittest.defaultTestLoader.discover("backend/tests"),
                  unittest.defaultTestLoader.discover("scripts/tests"),
              ]
          )
          result = unittest.TextTestRunner().run(suite)
          forbidden = [
              name
              for name in sys.modules
              if name == "ml" or name.startswith("ml.") or name == "torch" or name.startswith("torch.")
          ]
          if forbidden:
              raise SystemExit(f"API-only tests imported forbidden ML modules: {forbidden[:10]}")
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
