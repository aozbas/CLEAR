name: Docker CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-image:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t clear-backend:ci .

  ml-image:
    name: ML Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ML image
        run: docker build -f docker/ml.Dockerfile -t clear-ml:ci .
