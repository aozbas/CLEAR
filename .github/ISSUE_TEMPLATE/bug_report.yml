name: Bug report
description: Report something broken or behaving unexpectedly.
title: "Fix "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile
        - Backend
        - ML
        - CI
        - Docs/private notes
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Project phase
      options:
        - Stateless local demo readiness
        - Phase 0 foundation
        - Phase 1 binary baseline
        - Phone-photo model research
        - External generalization research
        - Phase 4 UX/responsibility polish
        - Unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Include the command, screen, endpoint, or workflow name.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the shortest reliable steps or commands.
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, device details, environment versions, or GitHub Actions links.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This issue does not include real secrets, tokens, PHI, PII, or other regulated data.
          required: true
        - label: Any model output is described as an experimental classification, not a diagnosis.
