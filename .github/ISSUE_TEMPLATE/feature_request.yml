name: Feature request
description: Propose a focused project improvement.
title: "Add "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile
        - Backend
        - ML
        - Hosted database
        - CI
        - Docs/private notes
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Target phase
      options:
        - Post-Phase-2 runtime/training setup
        - Phase 3 multi-dataset expansion
        - Phase 4 UX/responsibility polish
        - Phase 5 deferred RL
        - Maintenance/professionalization
        - Unsure
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this change accomplish?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Implementation notes, constraints, or alternatives.

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: What checks, behavior, or documentation prove this is finished?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits the current phase and does not introduce later-phase features early.
          required: true
        - label: This keeps mobile, backend, ML, and Hosted database responsibilities separated.
        - label: This avoids medical-certainty language and frames outputs as experimental classifications.
