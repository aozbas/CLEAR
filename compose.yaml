services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: clear-backend:dev
    env_file:
      - backend/.env
    environment:
      MODEL_PATH: /workspace/ml/models/pad_hiba_convnext_tiny_source_balanced_final_seed42.pt
      ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./ml/models/pad_hiba_convnext_tiny_source_balanced_final_seed42.pt:/workspace/ml/models/pad_hiba_convnext_tiny_source_balanced_final_seed42.pt:ro
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
